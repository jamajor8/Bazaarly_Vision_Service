<!DOCTYPE html>

<style>
  :root {

    --panel: #ffffff;
    --ink: #1c2220;
    --muted: #5d6865;
    --line: #cbd2cf;

    --warn: #b4531a;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; padding: 16px; max-width: 680px;
    background: var(--page); color: var(--ink);
    font: 16px/1.5 "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  h1 { margin: 0 0 12px; font-size: 1.25rem; font-weight: 650; letter-spacing: -0.01em; }

  #stage { position: relative; overflow: hidden; border-radius: 12px; background: #0f1312; }

<body>
<main>
  <h1>Garment scanner</h1>
 
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>

  <canvas id="canvas" class="hidden"></canvas>

    <textarea id="diagOut" rows="14" readonly></textarea>
  </details>
</main>
 
<script>
  // ---------- settings ----------
  const SCAN_INTERVAL_MS = 1500;   // minimum gap between photo attempts (only while the item is held still)
  const POLL_INTERVAL_MS = 1500;   // how often to check whether a description is ready
  const MAX_WIDTH = 1280;          // downscale full frames before sending
 
  const STILL_MS = 2000;           // the garment must be in view and not moving this long before a photo is taken
  const STILL_BOX = 0.03;          // outline edges may drift this much (fraction of the frame) and still count as still
  const STILL_DIFF = 6;            // average pixel change inside the garment (0-255) that counts as movement
 
  const HL_INTERVAL_MS = 150;      // how often to ask the server for a fresh outline
  const FILL_ALPHA = 0.05;         // green fill strength inside the garment (raise for stronger green)
  const STALE_MS = 1500;           // hide the highlight if the server stops answering
  const TW = 160;                  // tracking resolution (width); height follows the video
  const SEARCH = 8;                // max motion per video frame, in tracking pixels
  const STRIDE = 2;                // sample every 2nd pixel inside the garment
  const MAX_ERR = 25;              // mean pixel difference above this = lost track, hold position
 
  // ---------- session and state ----------
  let sid = null;
  try { sid = localStorage.getItem("sid"); } catch (e) {}
  if (!sid) {
    sid = Math.random().toString(36).slice(2) + Date.now().toString(36);
    try { localStorage.setItem("sid", sid); } catch (e) {}
  }
 
  let state = "idle";              // idle | scanning | duplicate | processing | review
  let busy = false;
  let pendingId = null, itemId = null, original = null;
 
  const $ = id => document.getElementById(id);
  const show = (id, on) => $(id).classList.toggle("hidden", !on);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const JSON_HDR = { "Content-Type": "application/json" };
 
  function setStatus(text, kind = "ok") {
    $("status").textContent = text;
    $("statusbar").dataset.kind = kind;
  }
 
  // ---------- API calls, with a request log for the diagnostics panel ----------
  const diag = { requests: [], echo: null, status: null };
 
  function logRequest(entry) {
    diag.requests.unshift(entry);
    diag.requests.length = Math.min(diag.requests.length, 15);
    renderDiag();
  }
 
  function describeBody(body) {
    if (body instanceof FormData) {
      return [...body.entries()].map(([k, v]) => v instanceof Blob
        ? { field: k, kind: "file", type: v.type, bytes: v.size }
        : { field: k, kind: "text", value: String(v).slice(0, 40) });
    }
    return typeof body === "string" ? body.slice(0, 120) : null;
  }
 
  async function api(path, opts = {}) {
    const t0 = performance.now();
    const quiet = (opts.method || "GET") === "GET" && path.startsWith("/items/");   // skip polling noise
    const entry = { time: new Date().toLocaleTimeString(), method: opts.method || "GET",
                    path, sent: describeBody(opts.body) };
    try {
      const r = await fetch(path, opts);
      const text = await r.text();
      entry.status = r.status;
      entry.ms = Math.round(performance.now() - t0);
      entry.response = text.slice(0, 300);
      if (!quiet || !r.ok) logRequest(entry);
      if (!r.ok) throw new Error(`${path} returned ${r.status}: ${text.slice(0, 300)}`);
      return JSON.parse(text);
    } catch (e) {
      if (!entry.status) { entry.error = String(e); logRequest(entry); }   // network failure
      throw e;
    }
  }
 
  // ---------- panels ----------
  function resetPanels() { show("dup", false); show("draft", false); clearHighlight(); }
 
  function resumeScanning(msg) {
    resetPanels();
    state = "scanning";
    lastAttempt = performance.now();   // keep the "Approved..." message visible for a moment
    setStatus(msg || "Show an item to the camera", "ok");
  }
 
  // ---------- capture a full frame ----------
  function captureBlob() {
    const v = $("video"), c = $("canvas");
    const scale = Math.min(1, MAX_WIDTH / v.videoWidth);
    c.width = v.videoWidth * scale;
    c.height = v.videoHeight * scale;
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    return new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
  }
 
  // Sends one photo to the server. Called by the stillness gate (updateGate), not on a timer.
  async function scanTick() {
    if (state !== "scanning" || busy || !$("video").videoWidth) return;
    busy = true;   // never overlap requests
    setStatus("Taking photo...", "busy");
    try {
      const form = new FormData();
      form.append("session_id", sid);
      form.append("image", await captureBlob(), "frame.jpg");
      const res = await api("/scan/frame", { method: "POST", body: form });
      if (state === "scanning") handleScan(res);
    } catch (e) {
      setStatus("Error: " + e.message, "error");
    } finally {
      busy = false;
      lastAttempt = performance.now();   // result messages stay visible for a moment
    }
  }
 
  function handleScan(res) {
    switch (res.result) {
      case "new_item":
      case "awaiting_approval":      // e.g. the page was reloaded mid-review
        startProcessing(res.item_id); break;
      case "duplicate_pending":
        showDuplicate(res.pending_id, res.existing_item); break;
      case "awaiting_user":
        showDuplicate(res.pending_id, null); break;
      case "rejected":
        setStatus("Too blurry. Hold the item steady", "warn"); break;
      case "no_garment":
        setStatus("No garment detected. Hold one up to the camera", "warn"); break;
      case "suppressed":
        setStatus("Same item still in view (already scanned)", "ok"); break;
      default:                       // cooldown
        setStatus("Hold still...", "busy");
    }
  }
 
  // ---------- duplicate prompt ----------
  function showDuplicate(pid, existing) {
    state = "duplicate";
    pendingId = pid;
    $("dupImg").src = existing ? existing.image_url : "";
    show("dupImg", !!existing);
    $("dupText").textContent = (existing && existing.overview) || "";
    show("dup", true);
    setStatus("Possible duplicate. Choose an option below", "warn");
  }
 
  async function resolveDup(action) {
    try {
      const res = await api(`/scan/pending/${pendingId}/resolve`,
        { method: "POST", headers: JSON_HDR, body: JSON.stringify({ action }) });
      show("dup", false);
      if (res.result === "new_item") startProcessing(res.item_id);
      else resumeScanning();
    } catch (e) { setStatus("Error: " + e.message, "error"); }
  }
  $("dupAdd").onclick = () => resolveDup("add");
  $("dupDismiss").onclick = () => resolveDup("dismiss");
 
  // ---------- description and review ----------
  async function startProcessing(id) {
    resetPanels();
    state = "processing";
    itemId = id;
    setStatus("Describing the item...", "busy");
    while (state === "processing") {
      try {
        const item = await api(`/items/${itemId}`);
        if (item.status === "ready") return showDraft(item);
        if (item.status === "error") return showError(item);
        if (item.status !== "processing") return resumeScanning();
      } catch (e) { setStatus("Error: " + e.message, "error"); }
      await sleep(POLL_INTERVAL_MS);
    }
  }
 
  function showDraft(item) {
    state = "review";
    original = { overview: item.descriptions.overview, full_description: item.descriptions.full_description };
    $("overview").value = original.overview;
    $("full").value = original.full_description;
    $("draftImg").src = `/items/${itemId}/image/0?t=${Date.now()}`;
    show("approve", true); show("retry", false); show("draft", true);
    setStatus("Review the description, then approve", "ok");
  }
 
  function showError(item) {
    state = "review";
    $("overview").value = ""; $("full").value = "";
    $("draftImg").src = `/items/${itemId}/image/0?t=${Date.now()}`;
    show("approve", false); show("retry", true); show("draft", true);
    setStatus("Description failed: " + item.error, "error");
  }
 
  $("approve").onclick = async () => {
    try {
      const edits = {};
      if ($("overview").value !== original.overview) edits.overview = $("overview").value;
      if ($("full").value !== original.full_description) edits.full_description = $("full").value;
      if (Object.keys(edits).length)
        await api(`/items/${itemId}`, { method: "PATCH", headers: JSON_HDR, body: JSON.stringify(edits) });
      await api(`/items/${itemId}/approve`, { method: "POST" });
      resumeScanning("Approved. Show the next item");
    } catch (e) { setStatus("Error: " + e.message, "error"); }
  };
 
  $("discard").onclick = async () => {
    try {
      await api(`/items/${itemId}/discard`, { method: "POST" });
      resumeScanning("Discarded. Show the next item");
    } catch (e) { setStatus("Error: " + e.message, "error"); }
  };
 
  $("retry").onclick = async () => {
    try {
      await api(`/items/${itemId}/retry`, { method: "POST" });
      startProcessing(itemId);
    } catch (e) { setStatus("Error: " + e.message, "error"); }
  };
 
  // ---------- live highlight: server keyframes + per-frame tracking in the browser ----------
  let TH = 120;
 
  // cumX/cumY = total motion measured so far (tracking px). anchor = cum at the moment the
  // keyframe's source frame was captured, so (cum - anchor) = motion since that frame.
  const trk = { prev: null, pts: null, hl: null, cumX: 0, cumY: 0, anchorX: 0, anchorY: 0 };
 
  // stillness gate: the photo is only taken after the garment has been in view and unmoving for STILL_MS
  //   bbox  = outline bounding box when the timer started (movement = an edge drifts more than STILL_BOX)
  //   ref   = grayscale frame when the timer started (movement = pixels inside the garment change)
  //   since = when the current "holding still" period began
  const still = { bbox: null, ref: null, since: 0 };
  let lastAttempt = 0;       // when the last photo attempt (or result message) happened
  let stillReady = false;    // true once the garment has been still long enough
 
  const hlCanvas = document.createElement("canvas");   // frames sent to the server
  const tCanvas = document.createElement("canvas");    // frames for tracking
  const tCtx = tCanvas.getContext("2d", { willReadFrequently: true });
  const rCanvas = document.createElement("canvas");    // used to rasterize the outline
  const rCtx = rCanvas.getContext("2d", { willReadFrequently: true });
  const SAD = new Float64Array((2 * SEARCH + 1) ** 2);
  let hlBusy = false;
 
  function syncTH() {
    const v = $("video");
    TH = Math.max(1, Math.round(TW * v.videoHeight / v.videoWidth));
  }
 
  function resetStill() {
    still.bbox = null; still.ref = null; still.since = 0; stillReady = false;
  }
 
  function clearHighlight() {
    trk.hl = null; trk.pts = null; trk.prev = null;
    resetStill();
    const o = $("overlay");
    o.getContext("2d").clearRect(0, 0, o.width, o.height);
  }
 
  // small grayscale copy of the current video frame
  function grabGray() {
    syncTH();
    if (tCanvas.width !== TW || tCanvas.height !== TH) {
      tCanvas.width = TW; tCanvas.height = TH; trk.prev = null; still.ref = null;
    }
    tCtx.drawImage($("video"), 0, 0, TW, TH);
    const d = tCtx.getImageData(0, 0, TW, TH).data;
    const g = new Uint8Array(TW * TH);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) g[j] = (d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8;
    return g;
  }
 
  // list of (x, y) pixels inside the garment outline, at tracking resolution
  function rasterize(outline) {
    rCanvas.width = TW; rCanvas.height = TH;
    rCtx.clearRect(0, 0, TW, TH);
    rCtx.fillStyle = "#000";
    rCtx.beginPath();
    outline.forEach(([x, y], i) => i ? rCtx.lineTo(x * TW, y * TH) : rCtx.moveTo(x * TW, y * TH));
    rCtx.closePath();
    rCtx.fill();
    const a = rCtx.getImageData(0, 0, TW, TH).data;
    const pts = [];
    for (let y = 0; y < TH; y += STRIDE)
      for (let x = 0; x < TW; x += STRIDE)
        if (a[(y * TW + x) * 4 + 3] > 128) pts.push(x, y);
    return Int32Array.from(pts);
  }
 
  // how far did the garment move between prev and cur? (block matching with sub-pixel refinement)
  function estimateShift(prev, cur, pts, offX, offY) {
    const S = SEARCH, n = 2 * S + 1;
    const ox = Math.round(offX), oy = Math.round(offY);   // where the garment is in prev right now
    SAD.fill(0);
    let used = 0;
    for (let i = 0; i < pts.length; i += 2) {
      const px = pts[i] + ox, py = pts[i + 1] + oy;
      if (px < S || py < S || px >= TW - S || py >= TH - S) continue;
      const pv = prev[py * TW + px];
      used++;
      for (let dy = -S; dy <= S; dy++) {
        const row = (py + dy) * TW + px;
        const base = (dy + S) * n + S;
        for (let dx = -S; dx <= S; dx++) {
          const d = cur[row + dx] - pv;
          SAD[base + dx] += d < 0 ? -d : d;
        }
      }
    }
    if (used < 40) return null;
 
    // small penalty on big shifts, so flat (textureless) regions resolve to "no motion"
    let best = Infinity, bx = 0, by = 0;
    for (let y = -S; y <= S; y++) {
      for (let x = -S; x <= S; x++) {
        const k = (y + S) * n + x + S;
        SAD[k] += used * 0.02 * (x * x + y * y);
        if (SAD[k] < best) { best = SAD[k]; bx = x; by = y; }
      }
    }
    const at = (x, y) => SAD[(y + S) * n + x + S];
    let sx = 0, sy = 0;
    if (bx > -S && bx < S) {
      const a = at(bx - 1, by), c = at(bx + 1, by), den = a - 2 * best + c;
      if (den > 0) sx = (a - c) / (2 * den);
    }
    if (by > -S && by < S) {
      const a = at(bx, by - 1), c = at(bx, by + 1), den = a - 2 * best + c;
      if (den > 0) sy = (a - c) / (2 * den);
    }
    const err = (best - used * 0.02 * (bx * bx + by * by)) / used;
    return { dx: bx + sx, dy: by + sy, err };
  }
 
  // bounding box of an outline, as fractions of the frame: [x0, y0, x1, y1]
  function bboxOf(outline) {
    let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
    for (const [x, y] of outline) {
      if (x < x0) x0 = x; if (y < y0) y0 = y;
      if (x > x1) x1 = x; if (y > y1) y1 = y;
    }
    return [x0, y0, x1, y1];
  }
 
  // average brightness change inside the garment between two grayscale frames
  function regionDiff(a, b, pts) {
    let sum = 0, n = 0;
    for (let i = 0; i < pts.length; i += 2) {
      const k = pts[i + 1] * TW + pts[i];
      const d = a[k] - b[k];
      sum += d < 0 ? -d : d;
      n++;
    }
    return n ? sum / n : 0;
  }
 
  // a fresh outline arrived: did the garment's silhouette move since the stillness timer started?
  function noteStill(outline) {
    const bb = bboxOf(outline), now = performance.now();
    if (!still.bbox) { still.bbox = bb; still.ref = null; still.since = now; return; }
    let moved = 0;
    for (let i = 0; i < 4; i++) moved = Math.max(moved, Math.abs(bb[i] - still.bbox[i]));
    if (moved > STILL_BOX) { still.bbox = bb; still.ref = null; still.since = now; }
  }
 
  // a fresh outline arrived from the server
  function setKeyframe(hl, sentX, sentY) {
    if (!hl) return clearHighlight();   // no garment in view: the stillness timer restarts
    syncTH();
    const img = new Image();
    img.src = "data:image/png;base64," + hl.mask_png;
    trk.hl = { outline: hl.outline, img, at: performance.now() };
    trk.anchorX = sentX; trk.anchorY = sentY;   // motion since the frame was sent is applied automatically
    trk.pts = rasterize(hl.outline);
    noteStill(hl.outline);
  }
 
  function renderHighlight() {
    const o = $("overlay"), v = $("video");
    if (o.width !== v.videoWidth || o.height !== v.videoHeight) { o.width = v.videoWidth; o.height = v.videoHeight; }
    const ctx = o.getContext("2d");
    ctx.clearRect(0, 0, o.width, o.height);
    const k = trk.hl;
    if (!k || performance.now() - k.at > STALE_MS) return;
 
    const sx = (trk.cumX - trk.anchorX) / TW * o.width;    // tracked motion since the keyframe
    const sy = (trk.cumY - trk.anchorY) / TH * o.height;
    if (k.img.complete && k.img.naturalWidth) {
      ctx.globalAlpha = FILL_ALPHA;
      ctx.drawImage(k.img, sx, sy, o.width, o.height);
      ctx.globalAlpha = 1;
    }
    ctx.beginPath();
    k.outline.forEach(([x, y], i) => {
      const px = x * o.width + sx, py = y * o.height + sy;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    });
    ctx.closePath();
    ctx.strokeStyle = stillReady ? "rgb(0, 200, 120)" : "rgb(255, 170, 0)";   // amber while waiting, green when still
    ctx.lineWidth = Math.max(3, o.width / 200);
    ctx.stroke();
  }
 
  // Decides when to take the photo: garment in view and unmoving for STILL_MS. Also updates the status text.
  function updateGate(now) {
    const fresh = !!(trk.hl && now - trk.hl.at < STALE_MS);
    if (!fresh) resetStill();
    stillReady = !!(fresh && still.bbox && now - still.since >= STILL_MS);
 
    if (stillReady && !busy && now - lastAttempt >= SCAN_INTERVAL_MS) {
      lastAttempt = now;
      scanTick();
      return;
    }
    if (!busy && now - lastAttempt > 2500) {    // don't overwrite the result of the last attempt
      const msg = !fresh ? "Show an item to the camera"
        : stillReady ? "Hold still..."
        : `Hold still for ${(Math.max(0, STILL_MS - (now - still.since)) / 1000).toFixed(1)}s`;
      if ($("status").textContent !== msg) setStatus(msg, stillReady ? "ok" : fresh ? "busy" : "idle");
    }
  }
 
  // runs once per new video frame (requestVideoFrameCallback), falling back to requestAnimationFrame
  function trackLoop() {
    const v = $("video");
    const next = cb => (v.requestVideoFrameCallback ? v.requestVideoFrameCallback(cb) : requestAnimationFrame(cb));
    const step = () => {
      const now = performance.now();
      if (state !== "scanning") {
        if (trk.hl) clearHighlight();
      } else if (v.videoWidth) {
        if (trk.pts) {
          const cur = grabGray();
          if (trk.prev) {
            const m = estimateShift(trk.prev, cur, trk.pts, trk.cumX - trk.anchorX, trk.cumY - trk.anchorY);
            if (m && m.err < MAX_ERR) { trk.cumX += m.dx; trk.cumY += m.dy; }
          }
          trk.prev = cur;
          // stillness check on pixels: compare with the frame from when the timer started
          if (still.bbox && trk.hl && now - trk.hl.at < STALE_MS) {
            if (!still.ref) still.ref = cur;
            else if (regionDiff(still.ref, cur, trk.pts) > STILL_DIFF) { still.ref = cur; still.since = now; }
          }
          renderHighlight();
        }
        updateGate(now);
      }
      next(step);
    };
    next(step);
  }
 
  // slow loop: ask the server for a fresh outline
  async function highlightTick() {
    const v = $("video");
    if (state !== "scanning" || hlBusy || !v.videoWidth) return;
    hlBusy = true;
    try {
      const w = 320, h = Math.round(w * v.videoHeight / v.videoWidth);
      hlCanvas.width = w; hlCanvas.height = h;
      hlCanvas.getContext("2d").drawImage(v, 0, 0, w, h);
      const sentX = trk.cumX, sentY = trk.cumY;   // tracker position at the moment this frame was captured
      const blob = await new Promise(r => hlCanvas.toBlob(r, "image/jpeg", 0.6));
      const form = new FormData();
      form.append("image", blob, "f.jpg");
      const res = await fetch("/scan/highlight", { method: "POST", body: form });   // plain fetch keeps the log readable
      if (res.ok && state === "scanning") setKeyframe((await res.json()).highlight, sentX, sentY);
    } catch (e) { /* the next tick retries */ }
    finally { hlBusy = false; }
  }
 
  // ---------- diagnostics panel ----------
  function envInfo() {
    const v = $("video");
    return {
      origin: location.origin,
      secureContext: window.isSecureContext,
      hasMediaDevices: !!navigator.mediaDevices,
      browser: navigator.userAgent,
      sessionId: sid,
      pageState: state,
      video: v.videoWidth ? `${v.videoWidth}x${v.videoHeight}` : "no video",
    };
  }
 
  function renderDiag() {
    $("diagOut").value = JSON.stringify(
      { env: envInfo(), echo: diag.echo, serverStatus: diag.status, recentRequests: diag.requests }, null, 2);
  }
 
  $("diagEcho").onclick = async () => {
    const form = new FormData();
    form.append("session_id", sid);
    if ($("video").videoWidth) {
      form.append("image", await captureBlob(), "frame.jpg");
    } else {                                   // no camera running: send a tiny generated image
      const c = document.createElement("canvas");
      c.width = c.height = 64;
      c.getContext("2d").fillRect(0, 0, 64, 64);
      form.append("image", await new Promise(r => c.toBlob(r, "image/jpeg")), "test.jpg");
    }
    try { diag.echo = await api("/debug/echo", { method: "POST", body: form }); }
    catch (e) { diag.echo = { error: String(e) }; }
    renderDiag();
  };
 
  $("diagStatus").onclick = async () => {
    try { diag.status = await api("/debug/status"); }
    catch (e) { diag.status = { error: String(e) }; }
    renderDiag();
  };
 
  $("diagCopy").onclick = async () => {
    renderDiag();
    const out = $("diagOut");
    out.select();
    try { await navigator.clipboard.writeText(out.value); } catch (e) { document.execCommand("copy"); }
    $("diagCopy").textContent = "Copied";
    setTimeout(() => { $("diagCopy").textContent = "Copy report"; }, 1500);
  };
 
  // ---------- start / pause ----------
  $("start").onclick = async () => {
    if (state === "scanning") {
      state = "idle";
      clearHighlight();
      $("start").textContent = "Start scanning";
      setStatus("Paused", "idle");
      return;
    }
    if (state !== "idle") return;
    if (!navigator.mediaDevices) {
      setStatus("The camera needs https or http://localhost:8000. Open the page at localhost, not 0.0.0.0", "error");
      return;
    }
    try {
      if (!$("video").srcObject) {
        $("video").srcObject = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }, audio: false });
      }
      $("start").textContent = "Pause";
      resumeScanning();
    } catch (e) { setStatus("Camera error: " + e.message, "error"); }
  };
 
  // ---------- go ----------
  // photos are no longer taken on a timer: updateGate() takes one when the garment has held still
  setInterval(highlightTick, HL_INTERVAL_MS);
  trackLoop();
  renderDiag();
</script>
</body>
</html>
